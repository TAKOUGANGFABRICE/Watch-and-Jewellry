version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: farel_db
    restart: always
    environment:
      POSTGRES_DB: farel_db
      POSTGRES_USER: farel_user
      POSTGRES_PASSWORD: farel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: farel_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farel_api
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: local
      DATABASE_URL: postgres://farel_user:farel_password@db:5432/farel_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farel_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DJANGO_ENV: local
      DATABASE_URL: postgres://farel_user:farel_password@db:5432/farel_db
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

